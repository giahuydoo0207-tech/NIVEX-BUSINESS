services:
  db:
    image: postgres:16-alpine
    container_name: nova-business-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nova
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_dev_only
    ports:
      - "5433:5432"
    volumes:
      - nova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nova-business-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/nova
      DATABASE_USER: nova
      DATABASE_PASSWORD: nova_dev_only
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SOLANA_NETWORK: devnet
    ports:
      - "8080:8080"

volumes:
  nova_postgres_data:
