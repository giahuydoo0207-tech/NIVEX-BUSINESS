server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: nova-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/nova}
    username: ${DATABASE_USER:nova}
    password: ${DATABASE_PASSWORD:nova_dev_only}
  flyway:
    enabled: true
    locations: classpath:db/migration

nova:
  solana:
    rpc-url: ${SOLANA_RPC_URL:https://api.devnet.solana.com}
    recipient: ${SOLANA_DEMO_RECIPIENT:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  network: ${SOLANA_NETWORK:devnet}
  usdc-mint: ${SOLANA_USDC_MINT:}
